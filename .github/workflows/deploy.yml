name: Build PHP portfolio and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom
          coverage: none
          tools: none
        env:
          update: true

      - name: Validate PHP syntax
        run: |
          php -l index.php
          php -l scripts/build.php

      - name: Render and validate static output
        run: php scripts/build.php

      - name: Check frontend integrity and build safeguards
        run: python3 tests/check_static.py --php php

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
